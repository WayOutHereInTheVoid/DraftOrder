<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Real League - Draft Order Reveal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%);
            color: white;
            min-height: 100vh;
            cursor: pointer;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(50, 205, 50, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(34, 139, 34, 0.1) 0%, transparent 50%);
            background-size: 100px 100px;
            z-index: -1;
        }
        
        .screen {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        
        .screen.active {
            display: block;
        }
        
        .league-title {
            font-family: 'Oswald', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            color: #32CD32;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        
        .subtitle {
            font-size: 2rem;
            color: #90EE90;
            margin-bottom: 40px;
            font-weight: 600;
        }
        
        .start-button {
            background: linear-gradient(45deg, #32CD32, #228B22);
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(50, 205, 50, 0.4);
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }
        
        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(50, 205, 50, 0.6);
        }
        
        .pick-reveal {
            margin-bottom: 40px;
        }
        
        .pick-number {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            color: #32CD32;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .revealing-text {
            font-size: 1.5rem;
            color: #90EE90;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .draft-card {
            position: relative;
            width: 400px;
            height: 250px;
            margin: 0 auto 40px;
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
        }
        
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .card-front {
            background: linear-gradient(45deg, #000000, #1a1a1a);
            border: 3px solid #32CD32;
        }
        
        .card-back {
            background: #000000;
            color: #000000;
            transform: rotateY(180deg);
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        .card-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #32CD32;
            letter-spacing: 2px;
        }

        .team-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        
        .continue-text {
            font-size: 1.2rem;
            color: #90EE90;
            margin-top: 20px;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        .summary-screen {
            text-align: left;
            max-width: 600px;
        }
        
        .summary-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            color: #32CD32;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .draft-order-list {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.3rem;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-position {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            color: #32CD32;
            font-size: 1.5rem;
            min-width: 60px;
        }

        .order-team-name {
            flex: 1;
            font-weight: 600;
            padding: 0 12px;
        }

        .order-team-image {
            width: 60px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(50, 205, 50, 0.4);
            flex-shrink: 0;
        }
        
        .restart-button {
            background: linear-gradient(45deg, #90EE90, #32CD32);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #000000;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            font-family: 'Oswald', sans-serif;
        }
        
        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(50, 205, 50, 0.4);
        }
        
        .first-pick-special {
            animation: greenGlow 2s infinite alternate;
        }
        
        @keyframes greenGlow {
            0% { 
                box-shadow: 0 10px 30px rgba(50, 205, 50, 0.5);
                transform: scale(1);
            }
            100% { 
                box-shadow: 0 15px 40px rgba(50, 205, 50, 0.8);
                transform: scale(1.02);
            }
        }
        
        @media (max-width: 768px) {
            .league-title {
                font-size: 2.5rem;
            }
            .draft-card {
                width: 300px;
                height: 200px;
            }
            .team-name {
                font-size: 1.8rem;
            }
            .card-logo {
                font-size: 1.5rem;
            }
            .revealed-picks {
                position: static !important;
                width: 100% !important;
                max-width: 300px;
                margin: 20px auto 0;
            }
        }
        
        .revealed-picks {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #32CD32;
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
        }
        
        .revealed-picks.visible {
            display: block;
        }
        
        .revealed-picks-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: #32CD32;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
        }
        
        .revealed-pick-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(50, 205, 50, 0.2);
        }
        
        .revealed-pick-item:last-child {
            border-bottom: none;
        }
        
        .revealed-pick-pos {
            font-weight: 700;
            color: #32CD32;
            min-width: 25px;
        }
        
        .revealed-pick-team {
            font-weight: 500;
            color: #90EE90;
            text-align: right;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-pattern"></div>
        
        <!-- Revealed Picks Display -->
        <div class="revealed-picks" id="revealed-picks">
            <div class="revealed-picks-title">REVEALED PICKS</div>
            <div id="revealed-picks-list">
                <!-- Revealed picks will be added here -->
            </div>
        </div>
        
        <!-- Welcome Screen -->
        <div class="screen active" id="welcome-screen">
            <h1 class="league-title">THE REAL LEAGUE</h1>
            <h2 class="subtitle">Draft Order Reveal</h2>
            <button class="start-button" onclick="startReveal()">REVEAL DRAFT ORDER</button>
        </div>
        
        <!-- Reveal Screen -->
        <div class="screen" id="reveal-screen">
            <div class="pick-reveal">
                <div class="pick-number" id="pick-number">Pick #12</div>
                <div class="revealing-text" id="revealing-text">Revealing pick #12...</div>
            </div>
            
            <div class="draft-card" id="draft-card">
                <div class="card-inner" id="card-inner">
                    <div class="card-front">
                        <div class="card-logo">THE REAL LEAGUE</div>
                    </div>
                    <div class="card-back">
                        <img class="team-image" id="team-image" src="" alt="Team">
                    </div>
                </div>
            </div>
            
            <div class="continue-text" id="continue-text" style="display: none;">Click anywhere to continue</div>
        </div>
        
        <!-- Summary Screen -->
        <div class="screen" id="summary-screen">
            <h2 class="summary-title">FINAL DRAFT ORDER</h2>
            <div class="draft-order-list" id="draft-order-list">
                <!-- Draft order will be populated here -->
            </div>
            <button class="restart-button" onclick="restartReveal()">Reveal New Order</button>
        </div>
    </div>

    <script>
        const teams = [
            "Lone Star Legends", "Denver Yetis", "Food Mafia", "D-Town Swirlies",
            "Rochester Jesters", "Mt. Fuji Murder Hornets", "Gilbert FFF (Bryce)", "Prestige WorldWide",
            "Sonora Sugar Skulls", "Brutal Hogs", "Cali Bird Gang", "California Burritos"
        ];

        const teamImages = {
            "Lone Star Legends":      "LoneStarLegends.jpeg",
            "Denver Yetis":           "DenverYetis.jpeg",
            "Food Mafia":             "FoodMafia.jpeg",
            "D-Town Swirlies":        "DTownSwirlies.jpeg",
            "Rochester Jesters":      "RochesterJesters.jpeg",
            "Mt. Fuji Murder Hornets":"MurderHornets.jpeg",
            "Gilbert FFF (Bryce)":    "GFFT.jpeg",
            "Prestige WorldWide":     "PrestigeWorldwide.jpeg",
            "Sonora Sugar Skulls":    "SonoraSugarSkulls.jpeg",
            "Brutal Hogs":            "BrutalHogs.jpeg",
            "Cali Bird Gang":         "BirdGang.jpeg",
            "California Burritos":    "CaliforniaBurritos.jpeg"
        };
        
        let draftOrder = [];
        let currentPick = 12;
        let isRevealing = false;
        let revealComplete = false;
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function startReveal() {
            document.body.style.overflow = 'hidden';
            // Generate random draft order
            const shuffledTeams = shuffleArray(teams);
            draftOrder = shuffledTeams.map((team, index) => ({
                team: team,
                position: index + 1
            }));
            
            // Clear revealed picks display
            const revealedPicksEl = document.getElementById('revealed-picks');
            const revealedPicksListEl = document.getElementById('revealed-picks-list');
            revealedPicksEl.classList.remove('visible');
            revealedPicksListEl.innerHTML = '';
            
            // Switch to reveal screen
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('reveal-screen').classList.add('active');
            
            // Start with pick 12
            currentPick = 12;
            setupReveal();
        }
        
        function setupReveal() {
            const pickNumberEl = document.getElementById('pick-number');
            const revealingTextEl = document.getElementById('revealing-text');
            const cardInner = document.getElementById('card-inner');
            const continueText = document.getElementById('continue-text');
            
            // Reset card and clear stale image before unflipping
            document.getElementById('team-image').src = '';
            cardInner.classList.remove('flipped');
            continueText.style.display = 'none';
            isRevealing = true;
            revealComplete = false;
            
            // Update text
            pickNumberEl.textContent = `Pick #${currentPick}`;
            revealingTextEl.textContent = `Revealing pick #${currentPick}...`;
            
            // Auto-flip card after delay
            setTimeout(() => {
                revealCard();
            }, 2000);
        }
        
        function revealCard() {
            const cardInner = document.getElementById('card-inner');
            const teamImageEl = document.getElementById('team-image');
            const revealingTextEl = document.getElementById('revealing-text');
            const continueText = document.getElementById('continue-text');

            // Find team for current pick
            const teamData = draftOrder.find(item => item.position === currentPick);

            // Update card content
            teamImageEl.src = teamImages[teamData.team] || '';
            teamImageEl.alt = teamData.team;
            
            // Add special effect for #1 pick
            if (currentPick === 1) {
                cardInner.classList.add('first-pick-special');
            } else {
                cardInner.classList.remove('first-pick-special');
            }
            
            // Flip card
            cardInner.classList.add('flipped');
            
            // Add to revealed picks display
            addToRevealedPicks(currentPick, teamData.team);
            
            // Hide revealing text and show continue text
            setTimeout(() => {
                revealingTextEl.style.display = 'none';
                if (currentPick > 1) {
                    continueText.textContent = `Click anywhere to reveal pick #${currentPick - 1}`;
                    continueText.style.display = 'block';
                } else {
                    continueText.textContent = 'Click anywhere to see final order';
                    continueText.style.display = 'block';
                }
                isRevealing = false;
                revealComplete = true;
            }, 1000);
        }
        
        function addToRevealedPicks(position, teamName) {
            const revealedPicksEl = document.getElementById('revealed-picks');
            const revealedPicksListEl = document.getElementById('revealed-picks-list');
            
            // Show the revealed picks display
            revealedPicksEl.classList.add('visible');
            
            // Create pick item
            const pickItem = document.createElement('div');
            pickItem.className = 'revealed-pick-item';
            pickItem.innerHTML = `
                <span class="revealed-pick-pos">#${position}</span>
                <span class="revealed-pick-team">${teamName}</span>
            `;
            
            // Add to the top of the list (most recent first)
            revealedPicksListEl.insertBefore(pickItem, revealedPicksListEl.firstChild);
        }
        
        function nextReveal() {
            if (isRevealing || !revealComplete) return;
            
            currentPick--;
            
            if (currentPick >= 1) {
                // Reset revealing text display
                document.getElementById('revealing-text').style.display = 'block';
                setupReveal();
            } else {
                showSummary();
            }
        }
        
        function showSummary() {
            document.getElementById('reveal-screen').classList.remove('active');
            document.getElementById('summary-screen').classList.add('active');

            // Hide the revealed picks sidebar
            document.getElementById('revealed-picks').classList.remove('visible');

            // Allow page to scroll on summary
            document.body.style.overflow = 'auto';
            
            const listEl = document.getElementById('draft-order-list');
            listEl.innerHTML = '';
            
            // Sort by draft position and display
            const sortedOrder = [...draftOrder].sort((a, b) => a.position - b.position);
            
            sortedOrder.forEach(item => {
                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                orderItem.innerHTML = `
                    <span class="order-position">#${item.position}</span>
                    <span class="order-team-name">${item.team}</span>
                    <img class="order-team-image" src="${teamImages[item.team] || ''}" alt="${item.team}">
                `;
                listEl.appendChild(orderItem);
            });
        }
        
        function restartReveal() {
            document.body.style.overflow = 'hidden';

            // Reset to welcome screen
            document.getElementById('summary-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
            
            // Hide and clear revealed picks display
            const revealedPicksEl = document.getElementById('revealed-picks');
            const revealedPicksListEl = document.getElementById('revealed-picks-list');
            revealedPicksEl.classList.remove('visible');
            revealedPicksListEl.innerHTML = '';
            
            // Reset variables
            draftOrder = [];
            currentPick = 12;
            isRevealing = false;
            revealComplete = false;
        }
        
        // Click handler for the entire document
        document.addEventListener('click', (e) => {
            // Only advance if we're on the reveal screen and not clicking buttons
            if (document.getElementById('reveal-screen').classList.contains('active') && 
                !e.target.classList.contains('start-button') && 
                !e.target.classList.contains('restart-button')) {
                nextReveal();
            }
        });
        
        // Prevent default context menu to avoid accidental right-clicks
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
